<body>
    <navbar>
        <ol>
            <li><a href="index.html">Home</a></li>
            <li><a href="view.html">View Polls</a></li>
            <li><a href="alter.html">Alter Polls</a></li>

<div class="main-content">
    <h1>Create Poll</h1>
    <p>
        Polling is a powerful way to give everyone a voice and shape decisions together. Remember, "Every vote counts, and every opinion matters." Create your poll and inspire .
    </p>
</div>
<di>
    <form id="pollForm">
        <lable for="question">Poll Question</lable>
        <input type="text" id="question" name="question" placeholder="Enter your poll question here" required>
        <div class="error" id="error-message" ></div>
        
       <div class="option-group" id="option-group">
        <label for="option1">Option1:</label>
        <input type="text" id="option1" name="option1" required>
        <label for="option2">Option2:</label>
        <input type="text" id="option2" name="option2" required>
</div>
<div class="erroe" id="optionsError"></div>
<div class="button-container" id="option-btn-container">
    <button type="button" id="addOption">Add More Options</button>
</div>
<div class="button-container"><button type="SUBMIT">CREATE POLL</button></div>
    </form>
</div>
</body>
<script>
const maxOptions = 5;
let optionCount = 2;

// Helper to update Remove Option button
function updateRemoveButton() {
    let removeBtn = document.getElementById('removeOption');
    if (optionCount > 2) {
        if (!removeBtn) {
            removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.id = 'removeOption';
            removeBtn.textContent = 'Remove Option';
            removeBtn.style.marginBottom = '10px';
            removeBtn.onclick = function() {
                if (optionCount > 2) {
                    // Remove last label and input
                    const optionGroup = document.getElementById('option-group');
                    optionGroup.removeChild(optionGroup.lastElementChild); // input
                    optionGroup.removeChild(optionGroup.lastElementChild); // label
                    optionCount--;
                    // Enable add button if it was disabled
                    document.getElementById('addOption').disabled = false;
                    // Remove button if only 2 options left
                    if (optionCount === 2) {
                        removeBtn.remove();
                    }
                }
            };
            // Insert above the option-group
            const btnContainer = document.getElementById('option-btn-container');
            btnContainer.parentNode.insertBefore(removeBtn, btnContainer);
        }
    } else if (removeBtn) {
        removeBtn.remove();
    }
}

document.getElementById('addOption').addEventListener('click', function() {
    if (optionCount >= maxOptions) return;
    optionCount++;
    const optionGroup = document.getElementById('option-group');
    const label = document.createElement('label');
    label.setAttribute('for', `option${optionCount}`);
    label.textContent = `Option${optionCount}:`;
    const input = document.createElement('input');
    input.type = 'text';
    input.id = `option${optionCount}`;
    input.name = `option${optionCount}`;
    input.required = true;
    optionGroup.appendChild(label);
    optionGroup.appendChild(input);
    if (optionCount === maxOptions) {
        document.getElementById('addOption').disabled = true;
    }
    updateRemoveButton();
});

document.getElementById('pollForm').addEventListener('submit', async function(event) {
    event.preventDefault(); // Prevent form submission

    const question = document.getElementById('question').value.trim();
    const options = [];
    for (let i = 1; i <= optionCount; i++) {
        const opt = document.getElementById(`option${i}`).value.trim();
        if (opt) options.push(opt);
    }

    // Validate question
    if (question === '') {
        document.getElementById('error-message').textContent = 'Please enter a poll question.';
        return;
    } else {
        document.getElementById('error-message').textContent = '';
    }

    // Validate options
    if (options.length < 2) {
        document.getElementById('optionsError').textContent = 'Please enter at least two options.';
        return;
    } else {
        document.getElementById('optionsError').textContent = '';
    }

    // Create poll object
    const pollData = {
        question: question,
        options: options.map(opt =>({voteoption:opt}))
    };

    // Send poll data to server (replace with your server URL)
    try {
        const response = await fetch("http://localhost:8080/polls", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(pollData)
        });

        if (response.ok) {
            alert("Poll created successfully!");
            document.getElementById("pollForm").reset();
            // Reset options to 2 and remove extra fields/buttons
            const optionGroup = document.getElementById('option-group');
            while (optionCount > 2) {
                optionGroup.removeChild(optionGroup.lastElementChild); // input
                optionGroup.removeChild(optionGroup.lastElementChild); // label
                optionCount--;
            }
            document.getElementById('addOption').disabled = false;
            updateRemoveButton();
        } else {
            alert("Failed to create poll. Check backend or CORS settings.");
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Error occurred while creating poll.");
    }
});

// Initial call to ensure Remove Option is not shown at start
updateRemoveButton();
</script>
</html>
