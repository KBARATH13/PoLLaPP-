<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2eddf">
    <title>Explore polls — Pollspace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-explore">
    <header class="site-header">
        <div class="nav-wrap">
            <a class="brand" href="index.html" aria-label="Pollspace home">
                <span class="brand-mark" aria-hidden="true"></span>
                Pollspace
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="view.html" aria-current="page">Explore</a>
                <a href="alter.html">Manage</a>
                <a class="nav-cta" href="create.html">Create a poll</a>
            </nav>
        </div>
    </header>
    <main class="page-shell page-shell--wide">
        <p class="eyebrow"><span class="eyebrow-dot"></span> Pin your vote to the board</p>
        <div class="page-heading">
            <div>
                <h1>Explore polls</h1>
                <p class="page-description" id="explore-description">Pick an option and see where the group stands. Public polls are open to everyone, including their creator; private ones need an invite link.</p>
            </div>
        </div>
        <section id="polls-container" class="polls-grid" aria-label="Available polls" aria-live="polite">
            <div class="skeleton-card" aria-hidden="true">
                <div class="skeleton skeleton-line skeleton-line--title"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line skeleton-line--short"></div>
                <div class="skeleton skeleton-line"></div>
            </div>
            <div class="skeleton-card" aria-hidden="true">
                <div class="skeleton skeleton-line skeleton-line--title"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line skeleton-line--short"></div>
                <div class="skeleton skeleton-line"></div>
            </div>
        </section>
    </main>
    <footer class="site-footer">A good question travels farther when everyone gets a say.</footer>
    <script>
        const API_URL = 'http://localhost:8080/polls';
        const container = document.getElementById('polls-container');
        const inviteToken = new URLSearchParams(window.location.hash.slice(1)).get('invite');
        const privateMode = Boolean(inviteToken);
        let privateVoterToken = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (character) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function showState(title, description, icon, action) {
            container.innerHTML = `<div class="state-card">
                <span class="state-icon" aria-hidden="true">${icon}</span>
                <h2>${title}</h2>
                <p>${description}</p>
                ${action || ''}
            </div>`;
        }

        function renderPolls(polls) {
            if (!polls.length) {
                showState('No polls yet', 'There aren’t any polls to vote on just yet. Create one and get the conversation started.', '＋',
                    '<a class="button" href="create.html">Create a poll</a>');
                return;
            }
            container.innerHTML = polls.map((poll) => {
                const options = Array.isArray(poll.options) ? poll.options : [];
                const totalVotes = Number(poll.totalVotes) || 0;
                const optionMarkup = options.map((option, index) => {
                    const hasResults = !privateMode || poll.hasVoted;
                    const votes = hasResults ? Number(option.voteCount) || 0 : 0;
                    const percentage = totalVotes ? Math.round((votes / totalVotes) * 100) : 0;
                    const action = poll.hasVoted
                        ? `<span class="poll-option-count">${votes} ${votes === 1 ? 'vote' : 'votes'} · ${percentage}%</span>`
                        : poll.limitReached
                            ? '<span class="poll-option-count limit-reached">Voting limit reached</span>'
                            : `<button class="button button--small" type="button" data-vote-poll="${escapeHtml(poll.id)}" data-vote-option="${index}">Vote</button>`;
                    return `<li class="poll-option">
                        <span class="poll-option-name">${escapeHtml(option.voteoption)}</span>
                        ${action}
                        ${hasResults ? `<span class="progress-track" aria-hidden="true"><span class="progress-fill" style="width:${percentage}%"></span></span>` : ''}
                    </li>`;
                }).join('');
                return `<article class="poll-card">
                    <h2>${escapeHtml(poll.question)}</h2>
                    <p class="poll-meta">${privateMode
                        ? `${poll.hasVoted ? `${totalVotes} total votes` : poll.limitReached ? 'Voting closed' : `Up to ${poll.voteLimit} votes`} · Private poll`
                        : `${options.length} ${options.length === 1 ? 'option' : 'options'}`}</p>
                    <ul class="poll-options">${optionMarkup}</ul>
                    ${!privateMode || poll.hasVoted ? `<div class="poll-card-footer"><span class="vote-total"><strong>${totalVotes}</strong> total ${totalVotes === 1 ? 'vote' : 'votes'}</span></div>` : ''}
                </article>`;
            }).join('');
        }

        function createVoterToken(pollId) {
            const key = `pollspace.voter.${pollId}`;
            let token = localStorage.getItem(key);
            if (token) return token;
            const bytes = new Uint8Array(32);
            crypto.getRandomValues(bytes);
            token = btoa(String.fromCharCode(...bytes))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            localStorage.setItem(key, token);
            return token;
        }

        async function loadPrivatePoll() {
            container.innerHTML = `<div class="skeleton-card" aria-hidden="true">
                <div class="skeleton skeleton-line skeleton-line--title"></div><div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line skeleton-line--short"></div><div class="skeleton skeleton-line"></div>
            </div>`;
            try {
                if (!privateVoterToken) {
                    const existingToken = localStorage.getItem(`pollspace.private-voter.${inviteToken}`);
                    if (existingToken) {
                        privateVoterToken = existingToken;
                    } else {
                        const bytes = new Uint8Array(32);
                        crypto.getRandomValues(bytes);
                        privateVoterToken = btoa(String.fromCharCode(...bytes))
                            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                        localStorage.setItem(`pollspace.private-voter.${inviteToken}`, privateVoterToken);
                    }
                }
                const response = await fetch(`${API_URL}/private`, {
                    headers: {
                        'X-Poll-Invite': inviteToken,
                        'X-Poll-Voter': privateVoterToken
                    }
                });
                if (!response.ok) throw new Error(`The server returned ${response.status}.`);
                const poll = await response.json();
                renderPolls([poll]);
            } catch (error) {
                console.error('Unable to load the private poll:', error);
                showState('This private poll link is unavailable', 'The invite link may be invalid or no longer active. Ask the poll creator for a current link.', '!',
                    '<a class="button button--secondary" href="view.html">Explore public polls</a>');
            }
        }

        async function loadPolls() {
            if (privateMode) {
                document.getElementById('explore-description').textContent = 'You’re viewing a private poll shared with you.';
                loadPrivatePoll();
                return;
            }
            container.innerHTML = `<div class="skeleton-card" aria-hidden="true">
                <div class="skeleton skeleton-line skeleton-line--title"></div><div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line skeleton-line--short"></div><div class="skeleton skeleton-line"></div>
            </div><div class="skeleton-card" aria-hidden="true">
                <div class="skeleton skeleton-line skeleton-line--title"></div><div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line skeleton-line--short"></div><div class="skeleton skeleton-line"></div>
            </div>`;
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`The server returned ${response.status}.`);
                }
                const polls = await response.json();
                if (!Array.isArray(polls)) throw new Error('The server returned an unexpected response.');
                renderPolls(polls);
            } catch (error) {
                console.error('Unable to load polls:', error);
                showState('We couldn’t load the polls', 'Check that the poll server is running and your connection is available, then try again.', '!',
                    '<button class="button button--secondary" type="button" id="retry-load">Try again</button>');
            }
        }

        container.addEventListener('click', async (event) => {
            const retryButton = event.target.closest('#retry-load');
            if (retryButton) {
                loadPolls();
                return;
            }
            const voteButton = event.target.closest('[data-vote-poll]');
            if (!voteButton || voteButton.disabled) return;
            voteButton.disabled = true;
            voteButton.textContent = 'Saving…';
            try {
                const response = await fetch(privateMode ? `${API_URL}/private/vote` : `${API_URL}/vote`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(privateMode ? {
                            'X-Poll-Invite': inviteToken,
                            'X-Poll-Voter': privateVoterToken
                        } : {})
                    },
                    body: JSON.stringify({
                        ...(privateMode ? {} : { pollId: Number(voteButton.dataset.votePoll) }),
                        optionIndex: Number(voteButton.dataset.voteOption)
                    })
                });
                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(result.message || `The server returned ${response.status}.`);
                }
                if (privateMode) await loadPrivatePoll();
                else await loadPolls();
            } catch (error) {
                console.error('Unable to submit vote:', error);
                if (privateMode) {
                    await loadPrivatePoll();
                } else {
                    voteButton.disabled = false;
                    voteButton.textContent = 'Try again';
                }
            }
        });

        loadPolls();
    </script>
</body>
</html>
