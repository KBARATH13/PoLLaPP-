<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLL PORTAL</title>
<style>
    body {
        background-image: url("../assets/home.jpg");
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        width: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    navbar {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 18px 0;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    ol {
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0;
        margin: 0;
    }
    li {
        margin: 0 25px;
    }
    navbar a {
        color: #fff;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 500;
        transition: color 0.2s;
    }
    navbar a:hover {
        color: #00e6e6;
    }
    .main-content {
        margin-top: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 0 10px;
        box-sizing: border-box;
    }
    h1{
        background-color: rgba(10, 0, 0, 0.8);
        color: crimson;
        font-size: 2.5rem;
        padding: 20px 30px;
        border-radius: 8px;
        text-align: center;
    }
    h1:hover{
        color:rgb(250, 0, 61);
        background-color: rgba(10, 0, 0, 0.9);
    }
    p{
        background: rgba(0, 0, 0, 0.7);
        color: rgba(0,255,255,0.7);
        font-size: 1.2rem;
        padding: 20px 30px;
        border-radius: 8px;
        text-align: center;
        margin: 10px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .button-group {
        display: flex;
        gap: 30px;
        margin-bottom: 40px;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
    }
    .main-btn {
        padding: 14px 36px;
        font-size: 1.1rem;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        background: linear-gradient(180deg, #000000 0%, #00b3b3 100%);
        color: white;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        transition: background 0.2s, transform 0.2s;
        margin-bottom: 10px;
    }
    .main-btn:hover {
        background: linear-gradient(180deg, #00b3b3 0%, #000000 100%);
        transform: translateY(-2px) scale(1.04);
    }
    @media screen and (max-width: 600px) {
        h1, p {
            font-size: 1.1rem;
            padding: 12px 10px;
        }
        .main-btn {
            padding: 10px 18px;
            font-size: 1rem;
            width: 100%;
            min-width: 0;
        }
        .button-group {
            flex-direction: column;
            gap: 18px;
            margin-bottom: 20px;
        }
        navbar ol {
            flex-direction: column;
            gap: 10px;
        }
        navbar {
            padding: 10px 0;
        }
        li {
            margin: 0 10px;
        }
        .main-content {
            margin-top: 80px;
            padding: 0 2vw;
        }
    }
</style>
</head>
<body>
    <navbar>
        <ol>
            <li><a href="/create.html">Create Polls</a></li>
            <li><a href="/view.html">View Polls</a></li>
            <li><a href="/alter.html">Alter Polls</a></li>
        </ol>
    </navbar>
    <div class="main-content">
        <h1>Welcome to Poll Portal</h1>
        <p>Create polls as you wish and let your friends, colleagues, and neighbours vote in them!</p>
        <div class="button-group">
            <a href="create.html"><button class="main-btn">Create Poll</button></a>
            <a href="view.html"><button class="main-btn">View Polls</button></a>
        </div>
    </div>
</body>
</html>
